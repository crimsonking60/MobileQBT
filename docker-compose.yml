# Dev qBittorrent instance. State lives under ./dev (gitignored).
# WebUI: http://localhost:28080
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: mobileqbt-dev-qbt
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      WEBUI_PORT: 28080
    ports:
      - "127.0.0.1:28080:28080"
      - "127.0.0.1:26881:6881"
      - "127.0.0.1:26881:6881/udp"
    volumes:
      - ./dev/qbt/config:/config
      - ./dev/qbt/downloads:/downloads
    restart: unless-stopped
