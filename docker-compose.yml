# Dev qBittorrent instance. State lives under ./dev (gitignored).
# WebUI: http://localhost:28080
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: mobileqbt-dev-qbt
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      WEBUI_PORT: 28080
    ports:
      - "127.0.0.1:28080:28080"
      - "127.0.0.1:26881:6881"
      - "127.0.0.1:26881:6881/udp"
    volumes:
      - ./dev/qbt/config:/config
      - ./dev/qbt/downloads:/downloads
      # alt-WebUI build (npm run package); enable it in qBittorrent with path /webui
      - ./release/mobileqbt-webui:/webui:ro
    restart: unless-stopped

  # tiny RSS feed for developing the RSS screens: add http://rss-fixture/feed.xml in qBittorrent
  rss-fixture:
    image: nginx:1.27-alpine
    container_name: mobileqbt-dev-rss
    volumes:
      - ./scripts/rss-fixture:/usr/share/nginx/html:ro
