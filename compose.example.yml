# Run MobileQBT next to (or away from) your qBittorrent and point it at the WebUI.
# Put your usual HTTPS reverse proxy / tunnel in front of port 8081 (HTTPS is needed to install the app).
services:
  mobileqbt:
    image: ghcr.io/crimsonking60/mobileqbt:latest   # or pin e.g. :2026.11.1
    # build: .                                      # to build from a checkout instead
    restart: unless-stopped
    environment:
      QBT_URL: http://qbittorrent:8080   # your qBittorrent WebUI; origin only, no path
    ports:
      - "8081:80"
