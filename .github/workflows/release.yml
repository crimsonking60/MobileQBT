name: Release

# Every push to main that changes the app is tagged with the next calendar version (YYYY.MM.N),
# built as a multi-arch image and published to ghcr.io, and recorded as a GitHub release.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
  workflow_dispatch:

# one release at a time, so version numbers can't collide
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the tag and release
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check and test
        run: |
          npm ci
          npm run check
          npm test

      - name: Compute version
        id: version
        run: |
          git fetch --tags --force
          version=$(git tag --list | node scripts/next-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # tag only once the image is published, so a failed build never burns a version number
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="${IMAGE,,}"   # registry paths must be lowercase
          {
            node scripts/changelog.mjs notes
            echo
            echo "Image: \`${image}:${VERSION}\`"
          } > notes.md
          # no changelog entries: fall back to GitHub's generated notes (commit list)
          if [ "$(node scripts/changelog.mjs notes | wc -c)" -eq 0 ]; then generate=--generate-notes; else generate=; fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            $generate \
            --notes-file notes.md

      # move "Unreleased" in CHANGELOG.md under the new version; committed as the repo owner so the
      # history only ever shows one account (GITHUB_TOKEN pushes don't start another workflow run)
      - name: Stamp changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(node scripts/changelog.mjs notes | wc -c)" -eq 0 ]; then echo "No unreleased entries"; exit 0; fi
          node scripts/changelog.mjs stamp "$VERSION" "$(date -u +%F)"
          owner="${GITHUB_REPOSITORY_OWNER}"
          id=$(gh api "users/${owner}" --jq .id)
          git config user.name "$owner"
          git config user.email "${id}+${owner}@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Changelog: ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
